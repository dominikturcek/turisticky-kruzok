<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR check-in | Turistický krúžok</title><style>body{margin:0;font-family:system-ui;background:#193b2a;color:#173427;display:grid;min-height:100vh;place-items:center}.card{width:min(420px,90%);background:#fff;border-radius:22px;padding:28px;box-shadow:0 18px 60px #0005}.tag{color:#176b3a;font-weight:900}h1{margin:.4rem 0}.muted{color:#6c7c73}.btn{display:inline-block;margin-top:16px;background:#176b3a;color:white;text-decoration:none;padding:12px 16px;border-radius:10px;font-weight:800}</style></head><body><main class="card"><div class="tag">🥾 TURISTICKÝ KRÚŽOK</div><h1>Kontrola účasti</h1><p class="muted" id="msg">Načítavam údaje QR kódu…</p><a class="btn" href="/pas/">Otvoriť turistický pas</a></main><script>const token=new URLSearchParams(location.search).get('token');document.getElementById('msg').textContent=token?'QR token bol načítaný. Po pripojení API sa tu účasť zapíše automaticky.':'QR kód neobsahuje token výletu.';</script></body></html>

<!doctype html>
<html lang="sk">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Detail výletu | Turistický krúžok
  </title>

  <link
    rel="stylesheet"
    href="../styles.css"
  >

</head>


<body>


<header class="detailHero">

  <nav class="nav wrap">

    <a
      class="brand"
      href="/turisticky-kruzok/"
    >

      <span class="logo">
        ▲<i>▲</i>
      </span>

      <span>

        <b>
          TURISTICKÝ KRÚŽOK
        </b>

        <small>
          ZÁKLADNÁ ŠKOLA NITRIANSKE RUDNO
        </small>

      </span>

    </a>


    <div class="navlinks">

      <a
        href="/turisticky-kruzok/"
      >
        DOMOV
      </a>

      <a
        class="passport"
        href="/turisticky-kruzok/pas/"
      >
        👥 TURISTICKÝ PAS
      </a>

    </div>

  </nav>

  <div class="tear"></div>

</header>


<main class="wrap trip-detail-page">

  <a
    class="back-link"
    href="/turisticky-kruzok/"
  >
    ← Späť na výlety
  </a>


  <div id="tripContent">

    <div class="trip-detail-card">

      <div class="trip-detail-loading">

        <h1>
          Načítavam výlet…
        </h1>

        <p>
          Načítavam údaje z databázy.
        </p>

      </div>

    </div>

  </div>

</main>


<footer>

  <div class="mountains"></div>

  <div class="wrap footerIn">

    <div class="brand footerBrand">

      <span class="logo">
        ▲<i>▲</i>
      </span>

      <span>

        <b>
          TURISTICKÝ KRÚŽOK
        </b>

        <small>
          Základná škola Nitrianske Rudno
        </small>

      </span>

    </div>


    <a href="/turisticky-kruzok/pas/">
      Turistický pas →
    </a>

  </div>

</footer>


<script type="module">

const API =
  "https://turisticky-kruzok-api.dominikturcek.workers.dev/api/public/trips";

const FALLBACK_IMAGE =
  "https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1400&q=88";

const DIFFICULTY = {
  easy: "ĽAHKÁ",
  medium: "STREDNÁ",
  hard: "ŤAŽKÁ"
};

const STATUS = {
  planned: "PLÁNOVANÝ VÝLET",
  current: "AKTUÁLNY VÝLET",
  completed: "USKUTOČNENÝ VÝLET"
};


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


// =====================================================
// DÁTUM
// =====================================================

function parseDate(value) {
  if (!value) {
    return null;
  }

  const parts =
    String(value)
      .split("-")
      .map(Number);

  if (
    parts.length !== 3 ||
    parts.some(Number.isNaN)
  ) {
    return null;
  }

  const date =
    new Date(
      parts[0],
      parts[1] - 1,
      parts[2]
    );

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return null;
  }

  return date;
}


function formatDate(value) {
  const date =
    parseDate(value);

  if (!date) {
    return "—";
  }

  return new Intl.DateTimeFormat(
    "sk-SK",
    {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    }
  ).format(date);
}


// =====================================================
// ČAS
// =====================================================

function formatTime(trip) {
  if (
    trip.time_from &&
    trip.time_to
  ) {
    return (
      `${trip.time_from} – ${trip.time_to}`
    );
  }

  return (
    trip.time_from ||
    trip.time_to ||
    "—"
  );
}


// =====================================================
// CHYBA
// =====================================================

function showError(
  container,
  title,
  message
) {
  container.innerHTML = `
    <div class="trip-detail-error">

      <h2>
        ${escapeHtml(title)}
      </h2>

      <p>
        ${escapeHtml(message)}
      </p>

      <a
        class="tripDetailButton"
        href="/turisticky-kruzok/"
      >
        ← Späť na hlavnú stránku
      </a>

    </div>
  `;
}


// =====================================================
// NAČÍTANIE DETAILU
// =====================================================

async function loadTrip() {
  const container =
    document.getElementById(
      "tripContent"
    );


  const params =
    new URLSearchParams(
      window.location.search
    );


  const id =
    Number(
      params.get("id")
    );


  if (
    !Number.isInteger(id) ||
    id <= 0
  ) {
    showError(
      container,
      "Výlet nebol nájdený",
      "V adrese chýba správne ID výletu."
    );

    return;
  }


  try {
    const response =
      await fetch(
        API,
        {
          headers: {
            Accept:
              "application/json"
          }
        }
      );


    if (!response.ok) {
      throw new Error(
        `API chyba ${response.status}`
      );
    }


    const data =
      await response.json();


    if (
      data?.ok !== true ||
      !Array.isArray(data.trips)
    ) {
      throw new Error(
        "API vrátilo neočakávaný formát dát."
      );
    }


    const trip =
      data.trips.find(
        item =>
          Number(item.id) === id
      );


    if (!trip) {
      showError(
        container,
        "Výlet nebol nájdený",
        "Požadovaný výlet sa v databáze nenachádza."
      );

      return;
    }


    document.title =
      `${trip.name || "Výlet"} | Turistický krúžok`;


    const difficulty =
      DIFFICULTY[
        trip.difficulty
      ] ||
      trip.difficulty ||
      "—";


    const status =
      STATUS[
        trip.status
      ] ||
      trip.status ||
      "";


    const bonus =
      Number(
        trip.bonus_points
      );


    container.innerHTML = `

      <article class="trip-detail-card">


        <div
          class="trip-detail-image"
          style="background-image:url('${escapeHtml(
            trip.image_url ||
            FALLBACK_IMAGE
          )}')"
        >

          <div class="trip-detail-top">

            <span
              class="trip-detail-status ${escapeHtml(
                trip.status || ""
              )}"
            >
              ${escapeHtml(status)}
            </span>


            <span class="trip-detail-difficulty">
              ⛰ ${escapeHtml(difficulty)}
            </span>

          </div>

        </div>


        <div class="trip-detail-content">


          <h1>
            ${escapeHtml(
              trip.name ||
              "Výlet"
            )}
          </h1>


          <div class="trip-route">
            📍 ${escapeHtml(
              trip.route ||
              "Trasa bude doplnená"
            )}
          </div>


          <div class="trip-data">


            <div>

              <span>
                DÁTUM
              </span>

              <strong>
                ${escapeHtml(
                  formatDate(
                    trip.trip_date
                  )
                )}
              </strong>

            </div>


            <div>

              <span>
                ČAS
              </span>

              <strong>
                ${escapeHtml(
                  formatTime(trip)
                )}
              </strong>

            </div>


            <div>

              <span>
                VZDIALENOSŤ
              </span>

              <strong>
                ${
                  trip.distance_km != null
                    ? `${escapeHtml(
                        trip.distance_km
                      )} km`
                    : "—"
                }
              </strong>

            </div>


            <div>

              <span>
                PREVÝŠENIE
              </span>

              <strong>
                ${
                  trip.elevation_m != null
                    ? `${escapeHtml(
                        trip.elevation_m
                      )} m`
                    : "—"
                }
              </strong>

            </div>


          </div>


          <div class="trip-detail-grid">


            <section class="trip-description">

              <h2>
                O výlete
              </h2>

              <p>
                ${escapeHtml(
                  trip.description ||
                  "Popis výletu bude doplnený."
                )}
              </p>

            </section>


            <section class="trip-description">

              <h2>
                Trasa
              </h2>

              <p>
                ${escapeHtml(
                  trip.route ||
                  "Trasa bude doplnená."
                )}
              </p>

            </section>


          </div>


          <div class="points-box">

            <div>

              <span>
                BODY ZA VÝLET
              </span>

              <strong>
                🏅 ${
                  trip.points ?? 0
                } bodov
              </strong>

            </div>


            ${
              Number.isFinite(bonus) &&
              bonus > 0

                ? `
                  <div>

                    <span>
                      BONUS
                    </span>

                    <strong>
                      ⭐ ${bonus} bodov
                    </strong>

                  </div>
                `

                : ""
            }

          </div>


        </div>

      </article>
    `;
  }

  catch (error) {
    console.error(
      "Nepodarilo sa načítať detail výletu:",
      error
    );

    showError(
      container,
      "Výlet sa nepodarilo načítať",
      "Skús stránku načítať znova."
    );
  }
}


loadTrip();

</script>

</body>
</html>

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Copy PWA files to dist
        run: |
          mkdir -p dist/pas
          mkdir -p dist/icons

          cp pas/index.html dist/pas/index.html
          cp manifest.json dist/manifest.json
          cp sw.js dist/sw.js

          cp pas/manifest.json dist/pas/manifest.json
          cp pas/sw.js dist/pas/sw.js

          cp icons/web-96.png dist/icons/web-96.png
          cp icons/web-180.png dist/icons/web-180.png
          cp icons/web-192.png dist/icons/web-192.png
          cp icons/web-512.png dist/icons/web-512.png

          cp icons/pass-96.png dist/icons/pass-96.png
          cp icons/pass-180.png dist/icons/pass-180.png
          cp icons/pass-192.png dist/icons/pass-192.png
          cp icons/pass-512.png dist/icons/pass-512.png

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
